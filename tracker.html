<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetSync — Study Tracker</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="tracker.css">
</head>
<body>

  <header class="tk-header">
    <div class="tk-brand">
      <img src="icons/icon48.png" alt="" width="26" height="26">
      <div>
        <h1>LeetSync</h1>
        <span class="tk-sub">Study tracker</span>
      </div>
    </div>
    <div class="tk-header-right">
      <a class="tk-source" id="tkSource" target="_blank" rel="noopener noreferrer"></a>
      <button class="tk-theme" id="tkTheme" title="Switch theme">◐</button>
    </div>
  </header>

  <nav class="tk-sheets" id="tkSheets"></nav>

  <section class="tk-overview">
    <div class="tk-stat">
      <div class="tk-stat-value" id="tkDone">0</div>
      <div class="tk-stat-label">Completed</div>
    </div>
    <div class="tk-stat">
      <div class="tk-stat-value" id="tkTotal">0</div>
      <div class="tk-stat-label">Total</div>
    </div>
    <div class="tk-stat">
      <div class="tk-stat-value" id="tkPct">0%</div>
      <div class="tk-stat-label">Progress</div>
    </div>
    <div class="tk-stat">
      <div class="tk-stat-value" id="tkTracked">0</div>
      <div class="tk-stat-label">Auto-tracked</div>
    </div>
    <div class="tk-bar-wrap">
      <div class="tk-bar"><span class="tk-bar-fill" id="tkBar"></span></div>
      <div class="tk-breakdown" id="tkBreakdown"></div>
    </div>
  </section>

  <section class="tk-toolbar">
    <div class="tk-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="tkSearch" type="search" placeholder="Search problems" autocomplete="off" spellcheck="false">
    </div>
    <div class="tk-filters" id="tkStatus">
      <button class="tk-chip active" data-status="all">All</button>
      <button class="tk-chip" data-status="todo">To do</button>
      <button class="tk-chip" data-status="done">Done</button>
    </div>
    <div class="tk-filters" id="tkLevel">
      <button class="tk-chip active" data-level="all">Any level</button>
      <button class="tk-chip" data-level="Easy">Easy</button>
      <button class="tk-chip" data-level="Medium">Medium</button>
      <button class="tk-chip" data-level="Hard">Hard</button>
    </div>
    <button class="tk-chip tk-expand" id="tkExpand">Expand all</button>
  </section>

  <main class="tk-list" id="tkList"></main>

  <footer class="tk-footer">
    <span id="tkFooterNote"></span>
    <span>Auto-synced by
      <a href="https://leetsync-site.vercel.app/" target="_blank" rel="noopener noreferrer"><strong>LeetSync</strong></a>
      · built by
      <a href="https://deveshsamant.in" target="_blank" rel="noopener noreferrer">deveshsamant.in</a></span>
  </footer>

  <script src="sheet-progress.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
